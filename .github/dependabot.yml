# Pinning by digest and commit SHA makes builds reproducible and auditable, but
# it also freezes them. Dependabot is the other half of that trade: it raises a
# pull request when any pinned reference moves, so the pins stay current.
#
# One moment each week rather than a trickle: all ecosystems open together on a
# Monday morning, so reviewing dependencies is one task on one day.
#
# This config lives in this repo (rebeliptv/iptv), not the development
# superproject: Dependabot reads each repo's own workflows.
version: 2

updates:
  # Minor and patch bumps batched into one PR; majors get their own, because a
  # major can change an interface and deserves to be read rather than skimmed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Supply-chain buffer: don't adopt a release in its first week, so yanked or
    # compromised releases have time to surface. Security updates are exempt.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
